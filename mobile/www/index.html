<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Job in Algeria — وظائف في الجزائر</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
  body { background: #f9fafb; color: #111827; }
  header { position: sticky; top: 0; z-index: 50; background: #fff; border-bottom: 1px solid #e5e7eb; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .logo .badge { background: #15803d; color: #fff; border-radius: 8px; padding: 2px 7px; font-size: 14px; }
  .logo .green { color: #15803d; }
  nav { display: flex; gap: 8px; align-items: center; }
  .btn { border: none; border-radius: 8px; padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: #15803d; color: #fff; }
  .btn-outline { background: #fff; color: #15803d; border: 1px solid #15803d; }
  .btn-block { width: 100%; padding: 12px; font-size: 15px; }
  .hero { background: linear-gradient(#166534, #15803d); color: #fff; padding: 32px 16px; text-align: center; }
  .hero h1 { font-size: 24px; }
  .hero p { margin-top: 8px; color: #dcfce7; font-size: 14px; }
  .searchbox { margin-top: 16px; background: #fff; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  input, select, textarea { width: 100%; border: 1px solid #d1d5db; border-radius: 8px; padding: 10px 12px; font-size: 14px; background: #fff; color: #111827; }
  .container { max-width: 640px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 19px; margin: 8px 0; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .card.job { cursor: pointer; }
  .card.job:active { border-color: #15803d; }
  .job-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .job-title { font-size: 16px; font-weight: 600; }
  .job-company { color: #4b5563; font-size: 13px; margin-top: 3px; }
  .pill { background: #dcfce7; color: #166534; border-radius: 999px; padding: 3px 10px; font-size: 11px; white-space: nowrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { background: #f3f4f6; border-radius: 6px; padding: 3px 8px; font-size: 11px; color: #6b7280; }
  .muted { color: #6b7280; font-size: 13px; }
  .error { color: #dc2626; font-size: 13px; margin-top: 6px; }
  .success { color: #15803d; font-size: 13px; margin-top: 6px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  .filters input { grid-column: 1 / -1; }
  a.link { color: #15803d; font-weight: 600; text-decoration: none; cursor: pointer; }
  .desc { white-space: pre-line; line-height: 1.7; color: #374151; font-size: 14px; margin-top: 8px; }
  .demo-banner { background: #fef3c7; color: #92400e; font-size: 12px; text-align: center; padding: 6px; }
  footer { text-align: center; color: #9ca3af; font-size: 12px; padding: 24px 16px; }
</style>
</head>
<body>
  <div class="demo-banner">نسخة تجريبية — البيانات محفوظة محلياً على جهازك</div>
  <header>
    <div class="logo" onclick="go('home')"><span class="badge">JIA</span> Job in <span class="green">Algeria</span></div>
    <nav id="nav"></nav>
  </header>
  <div id="app"></div>
  <footer>Job in Algeria © 2026 — منصة الوظائف الأولى في الجزائر</footer>
  <script src="app.js"></script>
</body>
</html>
