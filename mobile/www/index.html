<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Job in Algeria — وظائف في الجزائر</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Tahoma, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: #f9fafb; color: #111827; }
  header { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.92); backdrop-filter: blur(10px); border-bottom: 1px solid #e5e7eb; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .logo { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .logo .badge { background: #15803d; color: #fff; border-radius: 8px; padding: 2px 7px; font-size: 13px; }
  .logo .green { color: #15803d; }
  nav { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .btn { border: none; border-radius: 8px; padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer; transition: transform .12s ease, box-shadow .2s ease, background .2s ease; }
  .btn:active { transform: scale(.94); }
  .btn-primary { background: #15803d; color: #fff; }
  .btn-primary:active { background: #166534; }
  .btn-outline { background: #fff; color: #15803d; border: 1px solid #15803d; }
  .btn-block { width: 100%; padding: 12px; font-size: 15px; }
  .lang-select { border: 1px solid #d1d5db; border-radius: 8px; padding: 6px 8px; font-size: 13px; background: #fff; }
  .hero { background: linear-gradient(135deg, #14532d, #15803d, #16a34a); background-size: 200% 200%; animation: gradientShift 8s ease infinite; color: #fff; padding: 34px 16px; text-align: center; }
  @keyframes gradientShift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .hero h1 { font-size: 24px; animation: fadeUp .6s ease both; }
  .hero p { margin-top: 8px; color: #dcfce7; font-size: 14px; animation: fadeUp .6s .12s ease both; }
  .searchbox { margin-top: 16px; background: #fff; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 6px; animation: fadeUp .6s .22s ease both; box-shadow: 0 12px 32px rgba(0,0,0,.18); }
  input, select, textarea { width: 100%; border: 1px solid #d1d5db; border-radius: 8px; padding: 10px 12px; font-size: 14px; background: #fff; color: #111827; transition: border-color .2s ease, box-shadow .2s ease; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #15803d; box-shadow: 0 0 0 3px rgba(21,128,61,.14); }
  .container { max-width: 640px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 19px; margin: 8px 0; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .card.job { cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
  .card.job:active { transform: scale(.97); border-color: #15803d; box-shadow: 0 8px 20px rgba(21,128,61,.14); }
  .job-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .job-title { font-size: 16px; font-weight: 600; }
  .job-company { color: #4b5563; font-size: 13px; margin-top: 3px; }
  .pill { background: #dcfce7; color: #166534; border-radius: 999px; padding: 3px 10px; font-size: 11px; white-space: nowrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { background: #f3f4f6; border-radius: 6px; padding: 3px 8px; font-size: 11px; color: #6b7280; transition: transform .15s ease, background .2s ease, color .2s ease; }
  .tag:active { transform: scale(.92); background: #dcfce7; color: #166534; }
  .muted { color: #6b7280; font-size: 13px; }
  .error { color: #dc2626; font-size: 13px; margin-top: 6px; animation: shake .4s ease; }
  .success { color: #15803d; font-size: 13px; margin-top: 6px; animation: popIn .45s cubic-bezier(.18,1.25,.4,1) both; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  .filters input { grid-column: 1 / -1; }
  a.link { color: #15803d; font-weight: 600; text-decoration: none; cursor: pointer; }
  .desc { white-space: pre-line; line-height: 1.7; color: #374151; font-size: 14px; margin-top: 8px; }
  .demo-banner { background: #fef3c7; color: #92400e; font-size: 12px; text-align: center; padding: 6px; }
  footer { text-align: center; color: #9ca3af; font-size: 12px; padding: 24px 16px; }
  .file-drop { border: 2px dashed #d1d5db; border-radius: 10px; padding: 14px; text-align: center; font-size: 13px; color: #6b7280; cursor: pointer; transition: border-color .2s ease, background .2s ease; }
  .file-drop.has-file { border-color: #15803d; background: #f0fdf4; color: #166534; }

  /* Page transitions & staggered entrances (Instagram-like) */
  #app { animation: none; }
  #app.page-enter { animation: pageIn .38s cubic-bezier(.22,.9,.36,1) both; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }
  .stagger { animation: fadeUp .45s ease both; }
  /* Success overlay (Instagram heart-style) */
  .success-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 100; }
  .success-overlay .check { font-size: 84px; animation: heartPop .9s cubic-bezier(.18,1.4,.4,1) both; filter: drop-shadow(0 8px 24px rgba(21,128,61,.4)); }
  @keyframes heartPop { 0% { opacity: 0; transform: scale(.2); } 35% { opacity: 1; transform: scale(1.15); } 55% { transform: scale(.95); } 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.05); } }
  /* Skeleton shimmer */
  .skeleton { border-radius: 14px; height: 92px; margin-bottom: 12px; background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 37%, #f3f4f6 63%); background-size: 400% 100%; animation: shimmer 1.2s ease infinite; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
</style>
</head>
<body>
  <div class="demo-banner" data-i18n="demoBanner"></div>
  <header>
    <div class="logo" onclick="go('home')"><span class="badge">JIA</span> Job in <span class="green">Algeria</span></div>
    <nav id="nav"></nav>
  </header>
  <div id="app"></div>
  <footer id="footer"></footer>
  <script src="app.js"></script>
</body>
</html>
